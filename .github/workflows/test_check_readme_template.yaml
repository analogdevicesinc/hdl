## Unit tests for the README template checker. Runs only when the checker,
## its tests, or this workflow itself changes.
##############################################################################

name: README template checker tests

on:
  pull_request:
    branches:
      - main
      - 'hdl_[0-9]*_r*'
    paths:
      - '.github/scripts/check_readme_template.py'
      - '.github/tests/**'
      - '.github/workflows/test_check_readme_template.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest

      - name: Run checker unit tests
        run: pytest .github/tests/ -v
